<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GrowthLab</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/sessions.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <!-- Preconnect to Three.js CDN for faster loading -->
    <link rel="preconnect" href="https://unpkg.com">
    <!-- Preload Three.js core (loaded lazily but start fetching early) -->
    <link rel="modulepreload" href="https://unpkg.com/three@0.160.0/build/three.module.js">
    <!-- Preload 3D text font (avoids waiting for JS to request it) -->
    <link rel="preload" href="fonts/ShareTechMono_Regular.typeface.json" as="fetch" crossorigin>
</head>
<body class="sessions-page">
    <!-- Three.js Canvas Container (persistent - never destroyed during navigation) -->
    <div id="canvas-container"></div>

    <!-- Gyroscope permission button (iOS only, hidden by default) -->
    <button id="gyro-btn" class="gyro-button" aria-label="Enable motion control">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>
            <line x1="12" y1="2" x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="6" y2="12"/>
            <line x1="18" y1="12" x2="22" y2="12"/>
        </svg>
    </button>

    <!-- Content Overlay -->
    <div class="sessions-content">
        <!-- Presented by header -->
        <header class="sessions-header">
            <div class="presented-by">
                <span class="presented-by-text">Presented by</span>
                <picture>
                    <source srcset="media/index/growthassistant-logo.webp" type="image/webp">
                    <img src="media/index/growthassistant-logo.png" alt="GrowthAssistant" class="ga-logo" fetchpriority="high">
                </picture>
            </div>
        </header>

        <!-- Dynamic content area - swapped by router -->
        <main id="main-content" class="sessions-list">
            <!-- Content loaded dynamically -->
        </main>
    </div>

    <!-- SPA Router - handles navigation without page reload -->
    <script>
    (function() {
        const mainContent = document.getElementById('main-content');
        let currentView = null;
        let cohortsCache = null;
        let keyboardSelectedIndex = -1;

        // Determine view from URL
        function getViewFromURL() {
            const params = new URLSearchParams(window.location.search);
            const cohort = params.get('cohort');
            return cohort ? { type: 'sessions', cohort } : { type: 'cohorts' };
        }

        // Fetch and cache cohorts list
        async function getCohorts() {
            if (cohortsCache) return cohortsCache;

            const cohorts = [];
            let cohortNum = 1;
            while (true) {
                const cohortId = `cohort-${String(cohortNum).padStart(2, '0')}`;
                try {
                    const response = await fetch(`cohorts/${cohortId}/config.json`);
                    if (!response.ok) break;
                    const config = await response.json();
                    cohorts.push(config);
                    cohortNum++;
                } catch (e) {
                    break;
                }
            }
            cohortsCache = cohorts;
            return cohorts;
        }

        // Render cohorts list view
        async function renderCohorts() {
            const cohorts = await getCohorts();

            if (cohorts.length === 0) {
                mainContent.innerHTML = `
                    <h1>Cohorts</h1>
                    <ul><li class="error-message">No cohorts found.</li></ul>
                `;
                return;
            }

            mainContent.innerHTML = `
                <h1>Cohorts</h1>
                <ul>
                    ${cohorts.map((cohort, index) => {
                        const num = String(index + 1).padStart(2, '0');
                        return `
                            <li>
                                <a href="?cohort=${cohort.id}" data-spa-link>
                                    <span class="session-number">${num}</span>
                                    <span class="session-title">${cohort.name}</span>
                                    <span class="session-arrow">&rarr;</span>
                                </a>
                            </li>
                        `;
                    }).join('')}
                </ul>
            `;
            mainContent.classList.remove('sessions-view');
            mainContent.classList.add('cohort-selection');
            document.title = 'GrowthLab';
            currentView = { type: 'cohorts' };
            resetKeyboardSelection();
        }

        // Render sessions list view
        async function renderSessions(cohortId) {
            try {
                const response = await fetch(`cohorts/${cohortId}/config.json`);
                if (!response.ok) throw new Error('Config not found');

                const config = await response.json();

                mainContent.innerHTML = `
                    <div class="sessions-header-row">
                        <h1>Sessions: ${config.name}</h1>
                        <a href="/" class="back-to-cohorts" data-spa-link>&larr; All Cohorts</a>
                    </div>
                    <ul>
                        ${config.sessions.map((session, index) => {
                            const num = String(index + 1).padStart(2, '0');
                            return `
                                <li>
                                    <a href="session.html?cohort=${cohortId}&file=${session.file}">
                                        <span class="session-number">${num}</span>
                                        <span class="session-title">${session.title}</span>
                                        <span class="session-arrow">&rarr;</span>
                                    </a>
                                </li>
                            `;
                        }).join('')}
                    </ul>
                `;
                mainContent.classList.remove('cohort-selection');
                mainContent.classList.add('sessions-view');
                document.title = `GrowthLab - ${config.name}`;
                currentView = { type: 'sessions', cohort: cohortId };
                resetKeyboardSelection();

            } catch (error) {
                console.error('Failed to load sessions:', error);
                mainContent.innerHTML = `
                    <div class="sessions-header-row">
                        <h1>Sessions</h1>
                        <a href="/" class="back-to-cohorts" data-spa-link>&larr; All Cohorts</a>
                    </div>
                    <ul><li class="error-message">Could not load sessions for this cohort.</li></ul>
                `;
            }
        }

        // Navigate to a view (SPA-style)
        async function navigateTo(url, pushState = true) {
            const urlObj = new URL(url, window.location.origin);
            const params = new URLSearchParams(urlObj.search);
            const cohort = params.get('cohort');

            // Animate content transition
            mainContent.style.opacity = '0';
            await new Promise(r => setTimeout(r, 150));

            if (cohort) {
                await renderSessions(cohort);
            } else {
                await renderCohorts();
            }

            if (pushState) {
                history.pushState({}, '', url);
            }

            mainContent.style.opacity = '1';
        }

        // Handle clicks on SPA links
        document.addEventListener('click', (e) => {
            const link = e.target.closest('a[data-spa-link]');
            if (link) {
                e.preventDefault();
                navigateTo(link.href);
            }

            // Clear keyboard selection on any click
            resetKeyboardSelection();
        });

        // Handle browser back/forward
        window.addEventListener('popstate', () => {
            navigateTo(window.location.href, false);
        });

        // Keyboard navigation
        function resetKeyboardSelection() {
            keyboardSelectedIndex = -1;
            document.querySelectorAll('.sessions-list li').forEach(item => {
                item.classList.remove('keyboard-focus');
            });
        }

        function updateKeyboardSelection(newIndex) {
            const items = document.querySelectorAll('.sessions-list li');
            if (items.length === 0) return;

            items.forEach(item => item.classList.remove('keyboard-focus'));

            if (newIndex < 0) newIndex = items.length - 1;
            if (newIndex >= items.length) newIndex = 0;

            keyboardSelectedIndex = newIndex;
            items[keyboardSelectedIndex].classList.add('keyboard-focus');
            items[keyboardSelectedIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        document.addEventListener('keydown', (e) => {
            const items = document.querySelectorAll('.sessions-list li');
            if (items.length === 0) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                updateKeyboardSelection(keyboardSelectedIndex + 1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                updateKeyboardSelection(keyboardSelectedIndex - 1);
            } else if (e.key === 'Enter' && keyboardSelectedIndex >= 0) {
                e.preventDefault();
                const link = items[keyboardSelectedIndex].querySelector('a');
                if (link) {
                    if (link.hasAttribute('data-spa-link')) {
                        navigateTo(link.href);
                    } else {
                        window.location.href = link.href;
                    }
                }
            }
        });

        // Initial render based on URL
        const initialView = getViewFromURL();
        if (initialView.type === 'sessions') {
            renderSessions(initialView.cohort);
        } else {
            renderCohorts();
        }
    })();
    </script>

    <!-- Three.js from CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/sessions-3d.js"></script>
</body>
</html>
