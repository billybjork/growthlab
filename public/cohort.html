<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // Redirect cohort.html?cohort=X to index.html?cohort=X
        const params = new URLSearchParams(window.location.search);
        const cohort = params.get('cohort');
        const newUrl = cohort ? `index.html?cohort=${cohort}` : 'index.html';
        window.location.replace(newUrl);
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
